name: Actualizar RSS Pérez-Reverte XLSemanal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "update_feed.py"
      - "requirements.txt"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: perez-reverte-xl-rss
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generar RSS
        env:
          BACKFILL_CLICKS: "120"
          INCREMENTAL_CLICKS: "1"
        run: python update_feed.py

      - name: Guardar feed y catálogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml catalog.json state.json
          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "Actualizar RSS Pérez-Reverte XLSemanal"
            git push
          fi
